[build]
  base = "/"
  publish = "/.next"
  command = "npm install --legacy-peer-deps && npm run build"

[build.environment]
  MONGODB_URI = "${MONGODB_URI}"

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[context.production]
  publish = "/.next"
  base = "/"

[context.production.environment]
  MONGODB_URI = "${MONGODB_URI}"
